; ============================================
; PHP Configuration for Laravel Production
; ============================================

[PHP]

; Error handling
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/log/php-fpm/error.log

; Memory and execution limits
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; File uploads
upload_max_filesize = 20M
post_max_size = 20M
max_file_uploads = 20

; Performance
realpath_cache_size = 4M
realpath_cache_ttl = 600

; OPcache settings (production optimization)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.validate_timestamps = 0  ; Disable timestamp validation in production

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Session configuration
session.save_handler = files
session.save_path = "/var/www/when2meet/storage/framework/sessions"
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 0  ; Set to 1 if using HTTPS
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 100

; Date/Time
date.timezone = UTC

; Multibyte string
mbstring.language = UTF-8
mbstring.internal_encoding = UTF-8
mbstring.http_output = UTF-8

[bcmath]
bcmath.scale = 2
