; ============================================
; PHP-FPM Pool Configuration
; Optimized for e2-micro (1GB RAM)
; ============================================

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process management (optimized for low memory)
pm = dynamic
pm.max_children = 5        ; Maximum child processes (reduced for 1GB RAM)
pm.start_servers = 2       ; Startup child processes
pm.min_spare_servers = 1   ; Minimum idle processes
pm.max_spare_servers = 3   ; Maximum idle processes
pm.max_requests = 500      ; Recycle workers after 500 requests

; Process timeout
pm.process_idle_timeout = 10s
request_terminate_timeout = 300s

; Logging
php_admin_value[error_log] = /var/log/php-fpm/error.log
php_admin_flag[log_errors] = on

; Environment variables
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; PHP settings for Laravel
php_value[session.save_handler] = files
php_value[session.save_path] = /var/www/when2meet/storage/framework/sessions
php_value[upload_max_filesize] = 20M
php_value[post_max_size] = 20M
php_value[max_execution_time] = 300
php_value[memory_limit] = 256M

; Clear environment
clear_env = no

; Catch worker output
catch_workers_output = yes
