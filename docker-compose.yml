services:
  # ============================================
  # Laravel Application (PHP-FPM + Nginx)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        INSTALL_DEV_DEPS: "false"  # Production: no dev dependencies (no debugbar, larastan, etc.)
    container_name: when2meet-app
    restart: unless-stopped
    working_dir: /var/www/when2meet
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      # Persistent storage
      - ./storage:/var/www/when2meet/storage
      - ./bootstrap/cache:/var/www/when2meet/bootstrap/cache
      # SQLite database (if using SQLite)
      - ./database:/var/www/when2meet/database
      # Logs
      - ./storage/logs:/var/www/when2meet/storage/logs
    environment:
      # Laravel environment variables
      APP_NAME: ${APP_NAME:-When2Meet}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}

      # Database configuration
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-when2meet}
      DB_USERNAME: ${DB_USERNAME:-when2meet_user}
      DB_PASSWORD: ${DB_PASSWORD}

      # Cache configuration
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

      # Timezone
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - when2meet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: when2meet-postgres
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-when2meet}
      POSTGRES_USER: ${DB_USERNAME:-when2meet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Persistent database storage
      - postgres-data:/var/lib/postgresql/data
      # Initialization scripts
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - when2meet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-when2meet_user} -d ${DB_DATABASE:-when2meet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Redis Cache (Optional - for future optimization)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: when2meet-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis-data:/data
    networks:
      - when2meet-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full

# ============================================
# Named Volumes
# ============================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  when2meet-network:
    driver: bridge
